<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Учёба</title>
<meta name="description" content="Личный планировщик учёбы: план дня, Deep Work таймер, предметы, английский, прогресс.">
<meta name="theme-color" content="#fbf7f2">
<meta name="color-scheme" content="light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

  <defs>

    <symbol id="i-timer" viewBox="0 0 24 24"><circle cx="12" cy="13.5" r="7.5"/><path d="M12 9.5v4l2.5 1.5M9.5 2.5h5"/></symbol>
    <symbol id="i-book" viewBox="0 0 24 24"><path d="M12 6.5C10 5 7 4.5 3.5 5v13c3.5-.5 6.5 0 8.5 1.5 2-1.5 5-2 8.5-1.5V5C17 4.5 14 5 12 6.5z"/><path d="M12 6.5v13"/></symbol>
    <symbol id="i-chat" viewBox="0 0 24 24"><path d="M5 4.5h14a2 2 0 0 1 2 2v8.5a2 2 0 0 1-2 2h-7l-5 4v-4H5a2 2 0 0 1-2-2V6.5a2 2 0 0 1 2-2z"/><path d="M8 9.5h8M8 12.5h5"/></symbol>
    <symbol id="i-chart" viewBox="0 0 24 24"><path d="M5 20v-7M12 20V5M19 20V10"/></symbol>
    <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 7h9M19 7h1M4 17h1M11 17h9"/><circle cx="16" cy="7" r="2.5"/><circle cx="8" cy="17" r="2.5"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-left" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
    <symbol id="i-right" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13l11-6.5z" fill="currentColor"/></symbol>

    <symbol id="i-pencil" viewBox="0 0 24 24"><path d="M5 19l1-4L16.5 4.5a2 2 0 0 1 3 3L9 18z"/></symbol>
    <symbol id="i-down" viewBox="0 0 24 24"><path d="M12 4v11M7.5 10.5L12 15l4.5-4.5M5 20h14"/></symbol>
    <symbol id="i-up" viewBox="0 0 24 24"><path d="M12 15V4M7.5 8.5L12 4l4.5 4.5M5 20h14"/></symbol>

    <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5.5M12 7.5v.5"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>

<main id="view" aria-live="polite"></main>

<button id="timerPill" class="timer-pill" data-act="go" data-tab="timer" hidden></button>

<nav id="nav" aria-label="Основная навигация">
  <button data-act="go" data-tab="today"><span class="ni"><svg class="i"><use href="#i-today"/></svg></span><span>Сегодня</span></button>
  <button data-act="go" data-tab="timer"><span class="ni"><svg class="i"><use href="#i-timer"/></svg></span><span>Таймер</span></button>
  <button data-act="go" data-tab="subjects"><span class="ni"><svg class="i"><use href="#i-book"/></svg></span><span>Предметы</span></button>
  <button data-act="go" data-tab="english"><span class="ni"><svg class="i"><use href="#i-chat"/></svg></span><span>Английский</span></button>
  <button data-act="go" data-tab="progress"><span class="ni"><svg class="i"><use href="#i-chart"/></svg></span><span>Прогресс</span></button>
</nav>

<div id="sheetRoot"></div>
<div id="toast" role="status"></div>

<script src="js/util.js"></script>
<script src="js/store.js"></script>
<script src="js/today.js"></script>
<script src="js/timer.js"></script>
<script src="js/subjects.js"></script>
<script src="js/english.js"></script>
<script src="js/progress.js"></script>
<script src="js/more.js"></script>
<script src="js/app.js"></script>
